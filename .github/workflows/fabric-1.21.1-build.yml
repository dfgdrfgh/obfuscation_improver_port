name: Fabric 1.21.1 build and artifact validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid redundant builds for older commits. Manual runs are retained.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  fabric-1211:
    name: Build and verify Fabric 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the original 1.21.1 Fabric Stonecutter target
        run: |
          chmod +x gradlew
          ./gradlew :1.21.1-fabric:build --no-daemon --stacktrace
      - name: Validate the actual installable mod JAR
        id: verify_jar
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          folder = Path("versions/1.21.1-fabric/build/libs")
          jars = sorted(folder.glob("*.jar"))
          production = [p for p in jars if not any(
              flag in p.name for flag in ("-sources", "-dev", "-api")
          )]
          assert production, f"No remapped production JAR in {folder}: {jars}"
          matches = []
          for jar in production:
              try:
                  with ZipFile(jar) as archive:
                      if archive.testzip() is not None:
                          raise AssertionError(f"Corrupt JAR archive: {jar}")
                      if "fabric.mod.json" not in archive.namelist():
                          continue
                      metadata = json.loads(archive.read("fabric.mod.json"))
                      assert metadata["id"] == "obfuscation_improver", (jar, metadata["id"])
                      assert "1.21.1" in str(metadata["depends"]["minecraft"]), (jar, metadata["depends"]["minecraft"])
                      for entrypoint in metadata.get("entrypoints", {}).get("client", []):
                          if not isinstance(entrypoint, str):
                              continue
                          class_path = entrypoint.replace(".", "/") + ".class"
                          assert class_path in archive.namelist(), (jar, class_path)
                      matches.append(jar)
              except BadZipFile as error:
                  raise AssertionError(f"Invalid JAR: {jar}") from error
          assert len(matches) == 1, f"Expected one Fabric 1.21.1 mod JAR; got {matches}"
          print("Validated Fabric 1.21.1 mod JAR:", matches[0])
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"jar_path={matches[0]}\n")
          PY
      - name: Upload original installable 1.21.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: Obfuscation-Improver-Fabric-1.21.1
          path: ${{ steps.verify_jar.outputs.jar_path }}
          if-no-files-found: error
